<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ReqManager — Gestión de Requerimientos</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.x/dist/tabler-icons.min.css">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --color-background-primary:#ffffff;
  --color-background-secondary:#f5f5f4;
  --color-background-tertiary:#eeede9;
  --color-text-primary:#1a1a18;
  --color-text-secondary:#5f5e5a;
  --color-text-tertiary:#888780;
  --color-text-info:#185fa5;
  --color-text-danger:#a32d2d;
  --color-text-success:#0f6e56;
  --color-border-tertiary:rgba(0,0,0,0.1);
  --color-border-secondary:rgba(0,0,0,0.18);
  --color-border-primary:rgba(0,0,0,0.3);
  --border-radius-md:8px;
  --border-radius-lg:12px;
}
@media (prefers-color-scheme:dark){
  :root{
    --color-background-primary:#1e1e1c;
    --color-background-secondary:#282826;
    --color-background-tertiary:#141412;
    --color-text-primary:#e8e6df;
    --color-text-secondary:#9c9a92;
    --color-text-tertiary:#6b6965;
    --color-text-info:#85b7eb;
    --color-text-danger:#f09595;
    --color-text-success:#5DCAA5;
    --color-border-tertiary:rgba(255,255,255,0.1);
    --color-border-secondary:rgba(255,255,255,0.18);
    --color-border-primary:rgba(255,255,255,0.3);
  }
}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;font-size:14px;color:var(--color-text-primary);background:var(--color-background-tertiary)}
#app{display:flex;height:100vh;overflow:hidden}
#sidebar{width:210px;background:var(--color-background-primary);border-right:0.5px solid var(--color-border-tertiary);display:flex;flex-direction:column;flex-shrink:0}
#sidebar-header{padding:16px 14px 12px;border-bottom:0.5px solid var(--color-border-tertiary)}
#sidebar-header h1{font-size:13px;font-weight:600;color:var(--color-text-primary);letter-spacing:.02em}
#sidebar-header p{font-size:11px;color:var(--color-text-tertiary);margin-top:2px}
nav{flex:1;padding:8px 0;overflow-y:auto}
.nav-item{display:flex;align-items:center;gap:8px;padding:7px 14px;cursor:pointer;transition:background .12s;font-size:13px;color:var(--color-text-secondary);border-left:2px solid transparent}
.nav-item:hover{background:var(--color-background-secondary);color:var(--color-text-primary)}
.nav-item.active{background:var(--color-background-secondary);color:var(--color-text-primary);border-left-color:var(--color-text-info)}
.nav-item i{font-size:15px;width:16px}
.nav-section{font-size:10px;font-weight:600;color:var(--color-text-tertiary);padding:12px 14px 4px;text-transform:uppercase;letter-spacing:.07em}
#main{flex:1;display:flex;flex-direction:column;overflow:hidden}
#topbar{height:48px;background:var(--color-background-primary);border-bottom:0.5px solid var(--color-border-tertiary);display:flex;align-items:center;padding:0 20px;gap:8px;flex-shrink:0}
#topbar h2{font-size:14px;font-weight:500;flex:1}
#content{flex:1;overflow-y:auto;padding:20px}
.btn{display:inline-flex;align-items:center;gap:6px;padding:6px 14px;border-radius:var(--border-radius-md);border:0.5px solid var(--color-border-secondary);background:transparent;color:var(--color-text-primary);font-size:13px;cursor:pointer;transition:background .12s;font-family:inherit}
.btn:hover{background:var(--color-background-secondary)}
.btn.primary{background:var(--color-text-primary);color:var(--color-background-primary);border-color:transparent}
.btn.primary:hover{opacity:.88}
.btn.sm{padding:4px 10px;font-size:12px}
.btn.danger{color:var(--color-text-danger)}
.btn.success{color:var(--color-text-success);border-color:rgba(15,110,86,0.3)}
.autosave-indicator{font-size:11px;color:var(--color-text-tertiary);display:flex;align-items:center;gap:4px;opacity:0;transition:opacity .3s}
.autosave-indicator.show{opacity:1}
.card{background:var(--color-background-primary);border:0.5px solid var(--color-border-tertiary);border-radius:var(--border-radius-lg);padding:16px 18px;margin-bottom:12px}
.metric-card{background:var(--color-background-secondary);border-radius:var(--border-radius-md);padding:14px 16px;flex:1;min-width:100px}
.metric-card .label{font-size:11px;color:var(--color-text-tertiary);margin-bottom:4px;font-weight:600;text-transform:uppercase;letter-spacing:.05em}
.metric-card .value{font-size:24px;font-weight:500}
.metrics-row{display:flex;gap:10px;margin-bottom:14px;flex-wrap:wrap}
label{font-size:12px;color:var(--color-text-secondary);display:block;margin-bottom:4px;font-weight:500}
input,select,textarea{width:100%;padding:7px 10px;border:0.5px solid var(--color-border-secondary);border-radius:var(--border-radius-md);background:var(--color-background-primary);color:var(--color-text-primary);font-size:13px;font-family:inherit;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--color-border-primary)}
textarea{resize:vertical;min-height:70px}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px}
.field{margin-bottom:12px}
.field:last-child{margin-bottom:0}
.badge{display:inline-flex;align-items:center;padding:2px 8px;border-radius:20px;font-size:11px;font-weight:500}
.badge.pending{background:#FAEEDA;color:#633806}
.badge.analysis{background:#E6F1FB;color:#0C447C}
.badge.dev{background:#EAF3DE;color:#27500A}
.badge.qa{background:#EEEDFE;color:#3C3489}
.badge.uat{background:#FBEAF0;color:#72243E}
.badge.prod{background:#E1F5EE;color:#085041}
.badge.high{background:#FCEBEB;color:#791F1F}
.badge.medium{background:#FAEEDA;color:#633806}
.badge.low{background:#EAF3DE;color:#27500A}
@media(prefers-color-scheme:dark){
  .badge.pending{background:#412402;color:#FAC775}
  .badge.analysis{background:#042C53;color:#85B7EB}
  .badge.dev{background:#173404;color:#C0DD97}
  .badge.qa{background:#26215C;color:#AFA9EC}
  .badge.uat{background:#4B1528;color:#ED93B1}
  .badge.prod{background:#04342C;color:#5DCAA5}
  .badge.high{background:#501313;color:#F09595}
  .badge.medium{background:#412402;color:#FAC775}
  .badge.low{background:#173404;color:#C0DD97}
}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;font-size:11px;font-weight:600;color:var(--color-text-tertiary);padding:8px 10px;border-bottom:0.5px solid var(--color-border-tertiary);text-transform:uppercase;letter-spacing:.05em}
td{padding:9px 10px;border-bottom:0.5px solid var(--color-border-tertiary);vertical-align:middle}
tr:last-child td{border-bottom:none}
tr:hover td{background:var(--color-background-secondary)}
.empty-state{text-align:center;padding:64px 20px;color:var(--color-text-tertiary)}
.empty-state i{font-size:36px;margin-bottom:10px;display:block}
.empty-state p{font-size:13px;line-height:1.7}
.ai-box{background:var(--color-background-secondary);border:0.5px solid var(--color-border-secondary);border-radius:var(--border-radius-lg);padding:16px;margin-top:12px}
.ai-header{display:flex;align-items:center;gap:6px;font-size:12px;font-weight:600;color:var(--color-text-secondary);margin-bottom:10px}
.ai-output{font-size:13px;line-height:1.7;color:var(--color-text-primary);white-space:pre-wrap}
.loading-dots::after{content:'.';animation:dots 1.2s steps(3,end) infinite}
@keyframes dots{0%{content:'.'}33%{content:'..'}66%{content:'...'}}
.tab-row{display:flex;gap:0;border-bottom:0.5px solid var(--color-border-tertiary);margin-bottom:16px;overflow-x:auto}
.tab{padding:8px 14px;font-size:13px;cursor:pointer;border-bottom:2px solid transparent;color:var(--color-text-secondary);margin-bottom:-0.5px;white-space:nowrap}
.tab.active{color:var(--color-text-primary);border-bottom-color:var(--color-text-primary);font-weight:500}
.tab:hover{color:var(--color-text-primary)}
.progress-bar{height:4px;background:var(--color-background-secondary);border-radius:2px;overflow:hidden}
.progress-fill{height:100%;border-radius:2px;background:var(--color-text-info);transition:width .3s}
.req-item{border:0.5px solid var(--color-border-tertiary);border-radius:var(--border-radius-md);padding:12px 14px;margin-bottom:8px;cursor:pointer;transition:border-color .12s;background:var(--color-background-primary)}
.req-item:hover{border-color:var(--color-border-primary)}
.req-id{font-size:11px;color:var(--color-text-tertiary);font-weight:500}
.req-title{font-size:13px;font-weight:500;margin:3px 0 7px}
.req-meta{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;z-index:1000}
.modal{background:var(--color-background-primary);border-radius:var(--border-radius-lg);border:0.5px solid var(--color-border-tertiary);padding:24px;width:min(600px,96vw);max-height:90vh;overflow-y:auto;box-shadow:0 8px 32px rgba(0,0,0,.2)}
.modal h3{font-size:15px;font-weight:500;margin-bottom:16px}
.status-flow{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:8px}
.status-btn{padding:4px 10px;border-radius:20px;font-size:11px;cursor:pointer;border:0.5px solid var(--color-border-secondary);background:transparent;color:var(--color-text-secondary);transition:all .12s;font-family:inherit}
.status-btn:hover,.status-btn.active{background:var(--color-background-secondary);color:var(--color-text-primary);border-color:var(--color-border-primary);font-weight:500}
.kanban-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.kanban-col{background:var(--color-background-primary);border:0.5px solid var(--color-border-tertiary);border-radius:var(--border-radius-lg);padding:12px}
.kanban-header{font-size:11px;font-weight:600;color:var(--color-text-tertiary);text-transform:uppercase;letter-spacing:.05em;margin-bottom:10px;display:flex;justify-content:space-between;align-items:center}
.kanban-card{background:var(--color-background-secondary);border-radius:var(--border-radius-md);padding:9px 11px;margin-bottom:7px;font-size:12px;cursor:pointer;transition:opacity .12s}
.kanban-card:hover{opacity:.8}
.kanban-card .kc-title{font-weight:500;margin-bottom:4px;line-height:1.4}
.kanban-empty{font-size:11px;color:var(--color-text-tertiary);text-align:center;padding:16px 0}
.detail-row{display:flex;flex-direction:column;gap:4px;padding:10px 0;border-bottom:0.5px solid var(--color-border-tertiary)}
.detail-row:last-child{border-bottom:none}
.detail-label{font-size:11px;font-weight:600;color:var(--color-text-tertiary);text-transform:uppercase;letter-spacing:.05em}
.detail-value{font-size:13px;line-height:1.6}
.ers-section{margin-bottom:20px}
.ers-section h4{font-size:12px;font-weight:600;color:var(--color-text-tertiary);text-transform:uppercase;letter-spacing:.06em;margin-bottom:8px;padding-bottom:6px;border-bottom:0.5px solid var(--color-border-tertiary)}
.ers-section p,.ers-section li{font-size:13px;line-height:1.7;color:var(--color-text-primary)}
.ers-section ul{padding-left:18px}
.ers-req-item{border:0.5px solid var(--color-border-tertiary);border-radius:var(--border-radius-md);padding:10px 14px;margin-bottom:8px}
.ers-req-item .ers-req-id{font-size:11px;color:var(--color-text-tertiary);font-weight:600}
.ers-req-item .ers-req-title{font-size:13px;font-weight:500;margin:3px 0 4px}
.ers-req-item .ers-req-desc{font-size:12px;color:var(--color-text-secondary);line-height:1.6}
@media print{
  #sidebar,#topbar,#topbar-actions,.btn,.nav-item{display:none!important}
  #main{width:100%}
  #content{padding:0}
  .modal-overlay,.modal{display:none!important}
  body{background:white}
}
</style>
</head>
<body>
<div id="app">
  <div id="sidebar">
    <div id="sidebar-header">
      <h1><i class="ti ti-layers-intersect"></i> ReqManager</h1>
      <p>Gestión de requerimientos</p>
    </div>
    <nav>
      <div class="nav-section">Principal</div>
      <div class="nav-item active" onclick="navigate('dashboard')"><i class="ti ti-layout-dashboard"></i>Dashboard</div>
      <div class="nav-item" onclick="navigate('projects')"><i class="ti ti-folder"></i>Proyectos</div>
      <div class="nav-section">Trabajo</div>
      <div class="nav-item" onclick="navigate('relevamientos')"><i class="ti ti-clipboard-list"></i>Relevamientos</div>
      <div class="nav-item" onclick="navigate('requerimientos')"><i class="ti ti-list-check"></i>Requerimientos</div>
      <div class="nav-item" onclick="navigate('especificacion')"><i class="ti ti-file-description"></i>Especificación (ERS)</div>
      <div class="nav-item" onclick="navigate('seguimiento')"><i class="ti ti-git-branch"></i>Seguimiento</div>
      <div class="nav-section">Recursos</div>
      <div class="nav-item" onclick="navigate('evidencias')"><i class="ti ti-paperclip"></i>Evidencias</div>
      <div class="nav-section">Datos</div>
      <div class="nav-item" onclick="exportarDatos()"><i class="ti ti-download"></i>Exportar backup</div>
      <div class="nav-item" onclick="document.getElementById('import-file').click()"><i class="ti ti-upload"></i>Importar backup</div>
      <div class="nav-item" onclick="configurarApiKey()"><i class="ti ti-key"></i>Configurar API key</div>
    </nav>
  </div>
  <input type="file" id="import-file" accept=".json" style="display:none" onchange="importarDatos(this)">
  <div id="main">
    <div id="topbar">
      <h2 id="topbar-title">Dashboard ejecutivo</h2>
      <div id="topbar-actions"></div>
      <span class="autosave-indicator" id="autosave-ind"><i class="ti ti-check" style="font-size:12px"></i> Guardado</span>
    </div>
    <div id="content"></div>
  </div>
</div>
<div id="modal-container"></div>

<script>
const DB={
  get(k){try{return JSON.parse(localStorage.getItem('reqmgr_'+k)||'null')}catch{return null}},
  set(k,v){localStorage.setItem('reqmgr_'+k,JSON.stringify(v))},
  projects(){return this.get('projects')||[]},
  saveProjects(d){this.set('projects',d);flashSave()},
  relevamientos(){return this.get('relevamientos')||[]},
  saveRelevamientos(d){this.set('relevamientos',d);flashSave()},
  requerimientos(){return this.get('requerimientos')||[]},
  saveRequerimientos(d){this.set('requerimientos',d);flashSave()},
  ers(){return this.get('ers')||[]},
  saveErs(d){this.set('ers',d);flashSave()}
};

function flashSave(){
  const el=document.getElementById('autosave-ind');
  if(!el)return;
  el.classList.add('show');
  clearTimeout(window._saveTimer);
  window._saveTimer=setTimeout(()=>el.classList.remove('show'),2000);
}

const STATES=['Pendiente','Análisis','Desarrollo','QA','UAT','Producción'];
const STATE_KEY=['pending','analysis','dev','qa','uat','prod'];
const PRIO=['Alta','Media','Baja'];
const PRIO_KEY=['high','medium','low'];
const AREAS=['Operaciones','Logística','Finanzas','TI','RRHH','Comercial','Bunker','Puerto'];

let currentView='dashboard';
let autoSaveTimers={};

function autoSave(formGetter,saveFunc,delay=1200){
  clearTimeout(autoSaveTimers[saveFunc]);
  autoSaveTimers[saveFunc]=setTimeout(()=>{
    try{saveFunc(formGetter());}catch(e){}
  },delay);
}

function bindAutoSave(fields,getDataFn,saveFn){
  fields.forEach(id=>{
    const el=document.getElementById(id);
    if(!el)return;
    el.addEventListener('input',()=>autoSave(getDataFn,saveFn));
    el.addEventListener('change',()=>autoSave(getDataFn,saveFn));
  });
}

function navigate(view){
  currentView=view;
  document.querySelectorAll('.nav-item').forEach(el=>{
    el.classList.toggle('active',el.getAttribute('onclick')===`navigate('${view}')`);
  });
  const titles={dashboard:'Dashboard ejecutivo',projects:'Proyectos',relevamientos:'Relevamientos funcionales',requerimientos:'Requerimientos',especificacion:'Especificación (ERS)',seguimiento:'Seguimiento Kanban',evidencias:'Evidencias'};
  document.getElementById('topbar-title').textContent=titles[view]||view;
  const acts=document.getElementById('topbar-actions');
  acts.innerHTML='';
  if(view==='projects'){const b=mkBtn('primary','<i class="ti ti-plus"></i> Nuevo proyecto',()=>openProjectModal());acts.appendChild(b);}
  if(view==='relevamientos'){const b=mkBtn('primary','<i class="ti ti-plus"></i> Nuevo relevamiento',()=>openRelevamientoModal());acts.appendChild(b);}
  if(view==='requerimientos'){
    const b1=mkBtn('','<i class="ti ti-file-export"></i> Exportar PDF',()=>exportReqsPDF());acts.appendChild(b1);
    const b2=mkBtn('primary','<i class="ti ti-plus"></i> Nuevo requerimiento',()=>openReqModal());acts.appendChild(b2);
  }
  if(view==='especificacion'){
    const b=mkBtn('primary','<i class="ti ti-sparkles"></i> Generar ERS con IA',()=>openErsModal());acts.appendChild(b);
  }
  renderView(view);
}

function mkBtn(cls,html,fn){
  const b=document.createElement('button');
  b.className='btn'+(cls?' '+cls:'');
  b.innerHTML=html;b.onclick=fn;return b;
}

function renderView(v){
  const c=document.getElementById('content');
  const map={dashboard:renderDashboard,projects:renderProjects,relevamientos:renderRelevamientos,requerimientos:renderRequerimientos,especificacion:renderEspecificacion,seguimiento:renderSeguimiento,evidencias:renderEvidencias};
  c.innerHTML=(map[v]||renderDashboard)();
}

/* ── DASHBOARD ── */
function renderDashboard(){
  const reqs=DB.requerimientos(),projs=DB.projects(),relevs=DB.relevamientos(),ers=DB.ers();
  const byState=STATES.map(s=>reqs.filter(r=>r.estado===s).length);
  const byPrio=PRIO.map(p=>reqs.filter(r=>r.prioridad===p).length);
  return `<div class="metrics-row">
    <div class="metric-card"><div class="label">Proyectos activos</div><div class="value">${projs.filter(p=>p.estado!=='Producción').length}</div></div>
    <div class="metric-card"><div class="label">Requerimientos</div><div class="value">${reqs.length}</div></div>
    <div class="metric-card"><div class="label">Relevamientos</div><div class="value">${relevs.length}</div></div>
    <div class="metric-card"><div class="label">ERS generadas</div><div class="value">${ers.length}</div></div>
    <div class="metric-card"><div class="label">En producción</div><div class="value">${byState[5]||0}</div></div>
  </div>
  <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px">
    <div class="card">
      <div style="font-size:11px;font-weight:600;margin-bottom:14px;color:var(--color-text-tertiary);text-transform:uppercase;letter-spacing:.05em">Requerimientos por estado</div>
      ${STATES.map((s,i)=>{const cnt=byState[i];const pct=reqs.length?Math.round(cnt/reqs.length*100):0;
        return `<div style="margin-bottom:11px"><div style="display:flex;justify-content:space-between;margin-bottom:4px"><span style="font-size:12px">${s}</span><span style="font-size:12px;color:var(--color-text-secondary)">${cnt}</span></div><div class="progress-bar"><div class="progress-fill" style="width:${pct}%"></div></div></div>`;
      }).join('')}
    </div>
    <div class="card">
      <div style="font-size:11px;font-weight:600;margin-bottom:14px;color:var(--color-text-tertiary);text-transform:uppercase;letter-spacing:.05em">Prioridades</div>
      ${PRIO.map((p,i)=>`<div style="display:flex;justify-content:space-between;align-items:center;padding:7px 0;border-bottom:0.5px solid var(--color-border-tertiary)"><span style="font-size:13px">${p}</span><span class="badge ${PRIO_KEY[i]}">${byPrio[i]}</span></div>`).join('')}
      <div style="font-size:11px;font-weight:600;margin:16px 0 10px;color:var(--color-text-tertiary);text-transform:uppercase;letter-spacing:.05em">Proyectos recientes</div>
      ${projs.slice(-4).reverse().map(p=>`<div style="display:flex;justify-content:space-between;align-items:center;padding:6px 0;border-bottom:0.5px solid var(--color-border-tertiary)"><span style="font-size:12px">${escH(p.nombre)}</span><span class="badge ${STATE_KEY[STATES.indexOf(p.estado)]||'pending'}">${p.estado}</span></div>`).join('')||'<p style="font-size:12px;color:var(--color-text-tertiary)">Sin proyectos aún</p>'}
    </div>
  </div>`;
}

/* ── PROYECTOS ── */
function renderProjects(){
  const projs=DB.projects();
  if(!projs.length)return `<div class="empty-state"><i class="ti ti-folder-open"></i><p>No hay proyectos registrados.<br>Crea el primero con el botón de arriba.</p></div>`;
  return `<div class="card" style="padding:0;overflow:hidden"><table>
    <thead><tr><th>Proyecto</th><th>Área</th><th>Responsable</th><th>Estado</th><th>Prioridad</th><th>Fecha</th><th></th></tr></thead>
    <tbody>${projs.map((p,i)=>`<tr>
      <td style="font-weight:500">${escH(p.nombre)}</td>
      <td style="font-size:12px;color:var(--color-text-secondary)">${escH(p.area)}</td>
      <td>${escH(p.responsable)}</td>
      <td><span class="badge ${STATE_KEY[STATES.indexOf(p.estado)]||'pending'}">${p.estado}</span></td>
      <td><span class="badge ${PRIO_KEY[PRIO.indexOf(p.prioridad)]||'medium'}">${p.prioridad}</span></td>
      <td style="font-size:12px;color:var(--color-text-secondary)">${p.fecha||'-'}</td>
      <td><button class="btn sm" onclick="editProject(${i})"><i class="ti ti-edit"></i></button></td>
    </tr>`).join('')}</tbody>
  </table></div>`;
}

function openProjectModal(proj,idx){
  const isEdit=proj!==undefined;
  const p=proj||{nombre:'',area:AREAS[0],responsable:'',estado:STATES[0],prioridad:PRIO[1],fecha:new Date().toISOString().split('T')[0]};
  showModal(`<h3>${isEdit?'Editar':'Nuevo'} proyecto</h3>
    <div class="form-row">

    <select id="filter-proyecto" onchange="applyFilters()" style="width:auto;min-width:160px;font-size:12px;padding:5px 8px">

    </label>

  </div>`;
  const tabs=`<div class="tab-row">${['Todos',...STATES].map((s,idx)=>`<div class="tab${idx===0?' active':''}" onclick="filterByTab(this,'${s}')">${s}</div>`).join('')}</div>`;
  const list=reqs.map((r,i)=>`<div class="req-item" data-estado="${r.estado}" data-proyecto="${escH(r.proyecto||'')}" data-idx="${i}" style="display:flex;align-items:flex-start;gap:10px">
    <input type="checkbox" class="req-checkbox" data-idx="${i}" onchange="updateSelCount()" onclick="event.stopPropagation()" style="width:15px;height:15px;margin-top:3px;cursor:pointer;flex-shrink:0">
    <div style="flex:1;min-width:0" onclick="editReq(${i})">
      <div class="req-id">RF-${String(i+1).padStart(3,'0')}${r.proyecto?' · '+escH(r.proyecto):''}</div>

      <div class="req-meta">
        <span class="badge ${STATE_KEY[STATES.indexOf(r.estado)]||'pending'}">${r.estado}</span>
        <span class="badge ${PRIO_KEY[PRIO.indexOf(r.prioridad)]||'medium'}">${r.prioridad}</span>
        ${r.ia_generado?`<span style="font-size:11px;color:var(--color-text-tertiary)"><i class="ti ti-sparkles" style="font-size:11px"></i> IA</span>`:''}
      </div>
    </div>
  </div>`).join('');
  return filtros+tabs+`<div id="req-list">${list}</div>`;
}

function applyFilters(){
  const proyecto=document.getElementById('filter-proyecto')?.value||'';
  const activeTab=document.querySelector('.tab.active')?.textContent||'Todos';
  document.querySelectorAll('.req-item[data-estado]').forEach(item=>{
    const matchTab=activeTab==='Todos'||item.dataset.estado===activeTab;
    const matchProj=!proyecto||item.dataset.proyecto===proyecto;
    item.style.display=(matchTab&&matchProj)?'':'none';
  });
  updateSelCount();
}

function filterByTab(el,estado){
  document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
  el.classList.add('active');
  applyFilters();
}

function toggleSelAll(checked){
  document.querySelectorAll('.req-item[data-estado]').forEach(item=>{
    if(item.style.display!=='none'){
      const cb=item.querySelector('.req-checkbox');
      if(cb)cb.checked=checked;
    }
  });
  updateSelCount();
}

function updateSelCount(){
  const total=document.querySelectorAll('.req-checkbox:checked').length;
  const el=document.getElementById('sel-count');
  if(el)el.textContent=total>0?`${total} seleccionado${total>1?'s':''}  ·  clic en "Exportar PDF" para exportarlos`:'';
  const selAll=document.getElementById('sel-all');
  if(selAll){
    const visible=[...document.querySelectorAll('.req-item[data-estado]')].filter(i=>i.style.display!=='none');
    const allChecked=visible.length>0&&visible.every(i=>i.querySelector('.req-checkbox')?.checked);
    selAll.checked=allChecked;
  }
}

  const prompt=`Eres un analista de requerimientos experto. Analiza este relevamiento y genera requerimientos funcionales claros.

RELEVAMIENTO:
- Problema: ${rel.problema}
- Flujo actual: ${rel.flujo_actual||'No especificado'}
- Impacto: ${rel.impacto||'No especificado'}
- Usuarios: ${rel.usuarios||'No especificado'}
- Reglas de negocio: ${rel.reglas||'No especificadas'}

Genera entre 3 y 6 requerimientos funcionales. Responde SOLO con este JSON, sin texto adicional ni backticks:
{"requerimientos":[{"titulo":"Título corto","descripcion":"Qué debe hacer el sistema (el QUÉ, no el CÓMO)","prioridad":"Alta|Media|Baja","criterios":"Criterios de aceptación verificables"}]}`;
  try{
    const res=await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash-lite:generateContent?key=${getApiKey()}`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({contents:[{parts:[{text:prompt}]}]})});
    const data=await res.json();
    if(data.error){
      document.getElementById('ai-stream').textContent='Error de la API de Gemini:\n\n'+data.error.message+'\n\nVerifica tu API key en Datos → Configurar API key.';
      return;
    }
    const text=data.candidates?.[0]?.content?.parts?.[0]?.text||'';
    if(!text){
      document.getElementById('ai-stream').textContent='Gemini no devolvió contenido.\n\nRespuesta completa:\n'+JSON.stringify(data,null,2);
      return;
    }
    let parsed;
    try{
      parsed=JSON.parse(text.replace(/```json|```/g,'').trim());
    }catch(parseErr){
      document.getElementById('ai-stream').textContent='Error al interpretar la respuesta de Gemini.\n\nRespuesta recibida:\n'+text;
      return;
    }
    const reqs=DB.requerimientos();let added=0;
    parsed.requerimientos.forEach(r=>{reqs.push({titulo:r.titulo,descripcion:r.descripcion,prioridad:r.prioridad,criterios:r.criterios,estado:'Pendiente',proyecto:rel.proyecto,ia_generado:true,fecha:new Date().toISOString().split('T')[0]});added++;});
    DB.saveRequerimientos(reqs);
    const relevs=DB.relevamientos();if(relevs[relIdx])relevs[relIdx].reqs_generados=added;DB.saveRelevamientos(relevs);
    renderView('requerimientos');
  }catch(e){document.getElementById('ai-stream').textContent='Error de red al conectar con la IA.\n\nDetalle: '+e.message;}
}

async function generarERS(){
  if(!checkApiKey())return;
  const proyecto=v('ers-proyecto');

  closeModal();
  navigate('especificacion');

  const relevs=DB.relevamientos().filter(r=>r.proyecto===proyecto);
  const reqs=DB.requerimientos().filter(r=>r.proyecto===proyecto);
  const proj=DB.projects().find(p=>p.nombre===proyecto)||{};

  const prompt=`Eres un analista de sistemas experto. Genera una Especificación de Requerimientos de Software (ERS) formal y completa para el siguiente proyecto.

DATOS DEL PROYECTO:
- Nombre: ${proyecto}
- Área: ${proj.area||'No especificada'}
- Responsable: ${proj.responsable||'No especificado'}
- Estado: ${proj.estado||''}

RELEVAMIENTOS (${relevs.length}):
${relevs.map((r,i)=>`${i+1}. Problema: ${r.problema}. Flujo actual: ${r.flujo_actual||'N/A'}. Impacto: ${r.impacto||'N/A'}. Usuarios: ${r.usuarios||'N/A'}. Reglas: ${r.reglas||'N/A'}`).join('\n')||'No hay relevamientos registrados.'}

REQUERIMIENTOS FUNCIONALES (${reqs.length}):
${reqs.map((r,i)=>`RF-${i+1}: ${r.titulo}. ${r.descripcion||''}. Criterios: ${r.criterios||'N/A'}. Prioridad: ${r.prioridad}`).join('\n')||'No hay requerimientos registrados.'}

Genera la ERS completa. Responde SOLO con este JSON, sin texto adicional ni backticks:
{
  "objetivo": "Objetivo del sistema en 1-2 oraciones",
  "alcance": "Descripción del alcance del sistema",
  "stakeholders": ["Lista de stakeholders identificados"],
  "reqs_funcionales": [{"id":"RF-01","titulo":"titulo","descripcion":"descripcion completa","prioridad":"Alta|Media|Baja","criterios":"criterios de aceptación"}],
  "reqs_no_funcionales": [{"categoria":"Seguridad|Desempeño|Usabilidad|Confiabilidad|Escalabilidad","descripcion":"descripcion"}],
  "reglas_negocio": ["Regla de negocio 1", "Regla 2"],
  "restricciones": ["Restricción técnica o de negocio"],
  "supuestos": ["Supuesto 1"]
}`;

  try{
    const res=await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash-lite:generateContent?key=${getApiKey()}`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({contents:[{parts:[{text:prompt}]}]})});
    const data=await res.json();
    if(data.error){
      document.getElementById('ai-stream').textContent='Error de la API de Gemini:\n\n'+data.error.message+'\n\nVerifica tu API key en Datos → Configurar API key.';
      return;
    }
    const text=data.candidates?.[0]?.content?.parts?.[0]?.text||'';
    if(!text){
      document.getElementById('ai-stream').textContent='Gemini no devolvió contenido.\n\nRespuesta completa:\n'+JSON.stringify(data,null,2);
      return;
    }
    let parsed;
    try{
      parsed=JSON.parse(text.replace(/```json|```/g,'').trim());
    }catch(parseErr){
      document.getElementById('ai-stream').textContent='Error al interpretar la respuesta de Gemini.\n\nRespuesta recibida:\n'+text;
      return;
    }
    const ersArr=DB.ers();
    const newErs={proyecto,objetivo:parsed.objetivo,alcance:parsed.alcance,stakeholders:parsed.stakeholders||[],reqs_funcionales:parsed.reqs_funcionales||[],reqs_no_funcionales:parsed.reqs_no_funcionales||[],reglas_negocio:parsed.reglas_negocio||[],restricciones:parsed.restricciones||[],supuestos:parsed.supuestos||[],total_reqs:(parsed.reqs_funcionales||[]).length,fecha:new Date().toISOString().split('T')[0]};
    ersArr.push(newErs);
    DB.saveErs(ersArr);
    renderView('especificacion');
  }catch(e){document.getElementById('ai-stream').textContent='Error de red al conectar con la IA.\n\nDetalle: '+e.message;}
}

/* ── BACKUP / RESTAURAR ── */
function exportarDatos(){
  const data={
    version:'1.0',
    fecha:new Date().toISOString(),
    projects:DB.projects(),
    relevamientos:DB.relevamientos(),
    requerimientos:DB.requerimientos(),
    ers:DB.ers()
  };
  const json=JSON.stringify(data,null,2);
  const blob=new Blob([json],{type:'application/json'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');
  a.href=url;
  a.download='reqmanager_backup_'+new Date().toISOString().split('T')[0]+'.json';
  a.click();
  URL.revokeObjectURL(url);
}

function importarDatos(input){
  const file=input.files[0];
  if(!file)return;
  const reader=new FileReader();
  reader.onload=function(e){
    try{
      const data=JSON.parse(e.target.result);
      if(!data.projects&&!data.relevamientos&&!data.requerimientos){
        alert('El archivo no parece ser un backup válido de ReqManager.');
        return;
      }
      const total=(data.projects||[]).length+(data.relevamientos||[]).length+(data.requerimientos||[]).length+(data.ers||[]).length;
      if(!confirm(`Se encontraron ${total} registros en el backup:\n\n- ${(data.projects||[]).length} proyectos\n- ${(data.relevamientos||[]).length} relevamientos\n- ${(data.requerimientos||[]).length} requerimientos\n- ${(data.ers||[]).length} especificaciones ERS\n\n¿Deseas importar? Los datos actuales serán reemplazados.`))return;
      if(data.projects) DB.saveProjects(data.projects);
      if(data.relevamientos) DB.saveRelevamientos(data.relevamientos);
      if(data.requerimientos) DB.saveRequerimientos(data.requerimientos);
      if(data.ers) DB.saveErs(data.ers);
      input.value='';
      alert('¡Datos importados correctamente!');
      navigate('dashboard');
    }catch(err){
      alert('Error al leer el archivo: '+err.message);
    }
  };
  reader.readAsText(file);
}

function configurarApiKey(){
  const current=getApiKey();

      <div style="display:flex;justify-content:flex-end;gap:8px;margin-top:12px">

        <button class="btn primary" onclick="guardarApiKey()"><i class="ti ti-check"></i> Guardar y continuar</button>

}
